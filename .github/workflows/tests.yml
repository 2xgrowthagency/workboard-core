name: Core tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: git config --global user.email fixture@example.com
      - run: git config --global user.name 'Core CI'
      - run: node --test tests/*.test.mjs
      - run: node scripts/check-workboard-capabilities.mjs --repo "$PWD"
      - run: git diff --check
